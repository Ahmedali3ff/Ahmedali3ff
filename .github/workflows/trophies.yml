name: Generate GitHub Trophies

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Trophies
        run: |
          mkdir -p profile
          curl -L "https://github-profile-trophy.vercel.app/?username=Ahmedali3ff&theme=flat&no-frame=true&no-bg=true" \
            -o profile/trophy.svg

      - name: Commit Trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git diff --cached --quiet || git commit -m "Update GitHub trophies"
          git push
